<style>
:root{--bg:#f8ecec;--card:#fffbfa;--ink:#44302b;--mute:#947c78;--line:#ecd5d5;--pri:#6a4639;--on:#fff7f5;--rose:#dc9aa6;--soft:#f3d6da;
--t-move:#a8948d;--t-food:#c4636f;--t-hotel:#9a6f8d;--t-spot:#b07a50;--t-shop:#e08fa3}
@media (prefers-color-scheme:dark){:root{--bg:#2a1e1f;--card:#362728;--ink:#f5e6e4;--mute:#bba3a0;--line:#4f3a3b;--pri:#e6b8be;--on:#2e1f20;--rose:#cf8f9b;--soft:#4a3235;
--t-move:#b8a69f;--t-food:#e08b94;--t-hotel:#b997b0;--t-spot:#d4a077;--t-shop:#e6a5b2}}
*{box-sizing:border-box}[hidden]{display:none!important}
html{scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
h1,h3,.brand,.title{font-family:"Noto Serif TC","Songti TC",serif;font-weight:700}
button,select,input,textarea{font:inherit;color:inherit}
button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 14px;cursor:pointer}
button:hover{border-color:var(--rose)}
button.primary{background:var(--pri);border-color:var(--pri);color:var(--on)}
:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
.name:focus-visible,.time input:focus-visible,.title:focus-visible,.dayhead input:focus-visible,.gap input:focus-visible{outline:none;background:var(--soft);border-radius:6px}
.row input:focus-visible,.row select:focus-visible,.note:focus-visible{outline:none;border-color:var(--rose);box-shadow:0 0 0 2px var(--soft)}
.wrap{max-width:780px;margin:auto;padding:0 20px}
.homehead{display:flex;align-items:flex-end;gap:10px;padding:44px 0 22px;flex-wrap:wrap}
h1{margin:0;font-size:30px;letter-spacing:.08em;flex:1}
.homehead h1::after{content:"";display:block;width:36px;height:2px;background:var(--rose);margin-top:10px}
.hero{position:relative;height:200px;border-radius:18px;overflow:hidden;margin:0 0 22px;background:var(--soft)}
.hero svg{position:absolute;inset:0;width:100%;height:100%}
.hs{position:absolute;inset:0;opacity:0;transition:opacity 1s;display:block}.hs.on{opacity:1}
.hs img{width:100%;height:100%;object-fit:cover;display:block}
.hcap{position:absolute;left:0;right:0;bottom:0;padding:36px 20px 16px;background:linear-gradient(transparent,rgba(60,38,32,.62));color:#fff;display:flex;gap:10px;align-items:baseline}
.hcap b{font:700 20px "Noto Serif TC",serif;letter-spacing:.06em}
.hcap.fb{inset:0;background:none;color:#6a4639;font:700 22px "Noto Serif TC",serif;letter-spacing:.12em;align-items:center;padding:0 28px}
.dots{position:absolute;right:16px;bottom:14px;display:flex;gap:6px}.dots i{width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.55)}.dots i.on{background:#fff;width:16px}
.cv{height:84px;margin:-20px -20px 14px;background-size:cover}.cv img{width:100%;height:100%;object-fit:cover;display:block}
@media (prefers-color-scheme:dark){.hero svg{filter:brightness(.8)}}
@media (max-width:480px){.hero{height:160px}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;padding-bottom:60px}
.tc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;cursor:pointer;text-align:left;min-height:140px;display:flex;flex-direction:column;overflow:hidden}
.tc:hover{border-color:var(--rose)}
.tc h3{margin:0;font-size:20px;letter-spacing:.04em}
.tc p{margin:4px 0 0;color:var(--mute)}
.tc.new{align-items:center;justify-content:center;border-style:dashed;color:var(--pri);font-size:16px}
.tcact{margin-top:auto;padding-top:14px;display:flex;gap:6px}
.tcact button{padding:3px 12px;font-size:13px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:16px 0 6px}
.sp{flex:1}.sync{font-size:13px;color:var(--mute)}
.brand{color:var(--mute);letter-spacing:.2em;font-size:13px;margin-top:10px}
.titlebox{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:4px 0 6px}
.title{font-size:28px;border:0;border-bottom:1px solid transparent;background:none;padding:2px 0;min-width:0;width:min(100%,11em);letter-spacing:.04em}
.title:hover,.title:focus{border-bottom-color:var(--line)}
.meta{color:var(--mute)}.meta input{width:3em;border:0;border-bottom:1px dashed var(--line);background:none;text-align:center;color:inherit}
nav{position:sticky;top:0;background:var(--bg);z-index:5;border-bottom:1px solid var(--line);margin-top:10px}
.tabs{max-width:780px;margin:auto;display:flex;gap:4px;padding:8px 20px;overflow-x:auto}
.tab{border:0;background:none;padding:7px 16px;border-radius:999px;white-space:nowrap;color:var(--mute)}
.tab.on{background:var(--soft);color:var(--pri);font-weight:700}
main{max-width:780px;margin:auto;padding:18px 20px 80px}
.dayhead{display:flex;gap:8px;align-items:center;margin-bottom:14px}
.dayhead input{border:0;border-bottom:1px dashed var(--line);background:none;padding:4px 2px;font-size:18px;font-weight:700;width:9em;font-family:"Noto Serif TC",serif}
.dayhead input.date{font-weight:500;font-size:15px;color:var(--mute);width:7em;font-family:inherit}
.stop{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px}
.card,.gap{min-width:0}
.time{padding-top:14px;text-align:right}
.time input{width:100%;text-align:right;border:0;background:none;font-weight:700;font-size:17px;padding:0}
.card{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--c);border-radius:12px;padding:10px 14px;--c:var(--t-spot)}
.card[data-t=move]{--c:var(--t-move)}.card[data-t=food]{--c:var(--t-food)}.card[data-t=hotel]{--c:var(--t-hotel)}.card[data-t=shop]{--c:var(--t-shop)}
.name{width:100%;border:0;background:none;font-size:17px;font-weight:700;padding:2px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--mute);font-size:13px}
.row select,.row input{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px 6px}
.row input.stay{width:9em}.row input.kr{width:11em}
.note{width:100%;margin-top:6px;border:1px dashed var(--line);border-radius:8px;background:none;padding:6px 8px;resize:vertical;min-height:34px;font-size:14px;line-height:1.55;overflow:hidden;display:block}
.acts{display:flex;gap:4px;margin-left:auto}
.acts button{padding:0 8px;font-size:13px;line-height:24px}
.grip{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;padding:0 8px;font-size:18px;line-height:24px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.stop.dragging{opacity:.45}.stop.over .card{outline:2px dashed var(--rose)}
.row input.kr{order:2;flex:1 1 100%;width:100%}.row a.nv{order:3}.row .acts{order:4}
.gap{grid-column:2;display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:4px 0 4px 6px;color:var(--mute);font-size:13px;border-left:2px dotted var(--line);padding:6px 0 6px 14px}
.gap input{border:0;border-bottom:1px dashed var(--line);background:none;width:11em;padding:0 2px;color:var(--mute)}
a.nv{color:var(--pri);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:13px;background:var(--bg)}
a.nv:hover{border-color:var(--rose)}
.add{margin-top:14px;width:100%;border-style:dashed;color:var(--pri)}
.pics{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.pic{position:relative;width:96px;height:96px;border-radius:10px;overflow:hidden;border:1px solid var(--line);cursor:zoom-in;background:var(--bg)}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.pic .x{position:absolute;top:4px;right:4px;width:22px;height:22px;padding:0;border-radius:50%;background:rgba(60,40,35,.72);color:#fff;border:0;font-size:12px;line-height:22px}
.addimg{width:96px;height:96px;border:1px dashed var(--rose);border-radius:10px;background:none;color:var(--pri);font-size:13px;padding:0}
.pic .cvb{position:absolute;top:4px;left:4px;width:22px;height:22px;padding:0;border-radius:50%;background:rgba(60,40,35,.72);color:#fff;border:0;font-size:12px;line-height:22px}.pic .cvb.on{background:var(--rose)}
.ro .addimg,.ro .pic .x,.ro .pic .cvb{display:none}
#cvr,#cvx{font-size:13px;padding:2px 12px}
.lb{position:fixed;inset:0;background:rgba(40,25,22,.85);display:none;align-items:center;justify-content:center;z-index:30;padding:20px;cursor:zoom-out}
.lb.on{display:flex}.lb img{max-width:100%;max-height:100%;border-radius:12px}
.lb button{position:absolute;top:14px;right:18px;border:0;background:none;color:#fff;font-size:28px}
.ltitle{margin:0;font:700 18px "Noto Serif TC",serif}.lcount{color:var(--mute);font-size:13px}.tabsep{width:1px;background:var(--line);margin:6px 6px;flex:none}
.li{display:flex;gap:14px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.li input[type=checkbox]{width:22px;height:22px;margin-top:5px;accent-color:var(--pri);flex:none}
.lf{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.lf input{border:0;background:none;padding:2px 0;width:100%;border-radius:6px}
.lf .lt{font-weight:700;font-size:16px}.lf .ln{color:var(--mute);font-size:13px}
.lf input:focus-visible{outline:none;background:var(--soft)}
.li.done .lf input{text-decoration:line-through;opacity:.5}
.li>button{padding:0 9px;line-height:28px;flex:none}
.cvbar{height:110px;border-radius:14px;overflow:hidden;margin:8px 0 4px;background:var(--soft)}.cvbar img{width:100%;height:100%;object-fit:cover;display:block}
@media (max-width:480px){.cvbar{height:90px}}
.nc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:0 0 60px}.nc p{margin:6px 0 12px;color:var(--mute)}.nc button{margin-right:8px}
.tabs::after{content:"";flex:none;width:20px}
.foot{max-width:780px;margin:0 auto;padding:0 20px 60px}.foot button{color:var(--mute);font-size:13px}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);padding:24px;width:min(92vw,400px)}
dialog::backdrop{background:rgba(60,40,35,.4)}
dialog h3{margin:0 0 6px;font-size:20px}
dialog label{display:block;margin:12px 0 4px;color:var(--mute);font-size:13px}
dialog input{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg)}
.dact{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}
.hint{color:var(--mute);font-size:13px;margin:12px 0 0}
.toast{max-width:90vw;text-align:center;position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.show{opacity:1}
.ro #back,.ro #save,.ro #share,.ro #inv,.ro #exp,.ro #undo,.ro .acts,.ro .add,.ro [data-adddays],.ro [data-delday],.ro .kr,.ro .note:placeholder-shown{display:none}
.ro input,.ro textarea,.ro select{border-color:transparent!important;background:none!important;appearance:none;-webkit-appearance:none;pointer-events:none}
.ro .row select{padding:0}
#pv{display:none}
@page{size:A4;margin:14mm}
@media print{*{-webkit-print-color-adjust:exact;print-color-adjust:exact}body>section,dialog,.toast{display:none!important}#pv{display:block}body{background:#fff;color:#000}
#pv h1{font-size:24px;margin:0 0 2px}#pv .sub{color:#666;margin-bottom:14px}
#pv h2{font:700 18px "Noto Serif TC",serif;margin:18px 0 8px;padding-bottom:4px;border-bottom:1px solid #999;break-after:avoid}
#pv .pi{display:grid;grid-template-columns:56px 1fr;gap:8px;padding:3px 0;break-inside:avoid}
#pv .pi b{text-align:right}#pv .pi small{color:#666}#pv .mv{margin-left:64px;color:#777;font-size:12px;break-inside:avoid}#pv .pi img{width:110px;margin:6px 6px 0 0;border-radius:6px}
#pv .pgb{break-before:page}#pv .lp{display:grid;grid-template-columns:28px 1fr;gap:6px;padding:7px 0;border-bottom:1px solid #ddd;break-inside:avoid;font-size:15px}#pv .lp .bl{height:20px}#pv .lp small{color:#666}#pv .pcv{width:100%;height:110px;object-fit:cover;border-radius:8px;margin-bottom:10px}#pv .lp img{width:46px;height:46px;object-fit:cover;border-radius:5px;margin-right:8px;vertical-align:middle}#pv .subs div{padding:1px 0}#pv .fli{margin:0 0 8px;font-size:14px}}
#pdfbox{position:fixed;left:-10000px;top:0;width:688px;background:#fff;color:#000;font-family:"Noto Sans TC",sans-serif;font-size:15px;line-height:1.5}
#pdfbox h1{font-size:24px;margin:0 0 2px}#pdfbox .sub{color:#666;margin-bottom:14px}
#pdfbox h2{font:700 18px "Noto Serif TC",serif;margin:18px 0 8px;padding-bottom:4px;border-bottom:1px solid #999;break-after:avoid}
#pdfbox .pi{display:grid;grid-template-columns:56px 1fr;gap:8px;padding:3px 0;break-inside:avoid}
#pdfbox .pi b{text-align:right}#pdfbox .pi small{color:#666}#pdfbox .mv{margin-left:64px;color:#777;font-size:12px;break-inside:avoid}#pdfbox .pi img{width:110px;margin:6px 6px 0 0;border-radius:6px}
#pdfbox .pgb{break-before:page}#pdfbox .lp{display:grid;grid-template-columns:28px 1fr;gap:6px;padding:7px 0;border-bottom:1px solid #ddd;break-inside:avoid;font-size:15px}#pdfbox .lp .bl{height:20px}#pdfbox .lp small{color:#666}#pdfbox .pcv{width:100%;height:110px;object-fit:cover;border-radius:8px;margin-bottom:10px}#pdfbox .lp img{width:46px;height:46px;object-fit:cover;border-radius:5px;margin-right:8px;vertical-align:middle}#pdfbox .subs div{padding:1px 0}#pdfbox .fli{margin:0 0 8px;font-size:14px}
.dayhead button{white-space:nowrap}
.rtbtn{color:var(--pri);font-weight:700;display:inline-flex;align-items:center;gap:6px}.rtbtn .rti{flex:none}
.locb{border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:13px;background:var(--bg);color:var(--pri);cursor:pointer;font-family:inherit}.locb.on{background:var(--soft)}
#rdlg,#ldlg{border:0;padding:0;border-radius:18px;background:var(--card);color:var(--ink)}
#rdlg{width:min(920px,94vw);height:min(720px,90vh);overflow:hidden}
#ldlg{width:min(520px,94vw);max-height:86vh;overflow:auto}
#rdlg::backdrop,#ldlg::backdrop{background:rgba(60,40,35,.45)}
.rt-sheet{display:flex;flex-direction:column;height:100%}
.rt-top{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.rt-top h2{font-size:17px;margin:0;flex:1}
.rt-x{flex:none;box-sizing:border-box;border:0;background:var(--soft);color:var(--pri);width:36px;height:36px;min-width:36px;min-height:0;padding:0;margin:0;border-radius:50%;font-size:20px;line-height:1;display:grid;place-items:center;cursor:pointer}
.rt-dtabs{display:flex;gap:6px;padding:8px 14px 0;overflow-x:auto}
.rt-dtabs button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;font:inherit;cursor:pointer}
.rt-dtabs button.on{background:var(--pri);color:var(--on);border-color:var(--pri)}
#rmapwrap{position:relative;flex:1;min-height:200px;margin-top:8px;background:#e7dcd8}

.rt-chips{display:flex;gap:8px;overflow-x:auto;padding:10px 14px}
.rt-chip{flex:none;display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:8px 12px;font:inherit;cursor:pointer;white-space:nowrap}
.rt-chip i{font-style:normal;background:var(--pri);color:var(--on);width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700}
.rt-chip.warn{border-color:#e0a030}.rt-chip.warn i{background:#e0a030}.rt-pin.warn{background:#e0a030}.rt-cand{padding:0 14px 8px;max-height:34%;overflow:auto}.rt-cand b{display:block;font-size:13px;margin-bottom:6px}.rt-cand button{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:9px 12px;margin-bottom:6px;font:inherit;cursor:pointer}.rt-cand small{color:var(--mute);display:block}.rt-cand .rt-man{text-align:center;color:var(--pri);font-weight:700}.rt-chip.no{border-style:dashed;color:var(--mute)}.rt-chip.no i{background:var(--mute)}.rt-chip.on{border-color:var(--pri)}

.lc-body{padding:14px;display:flex;flex-direction:column;gap:10px}

.lc-btns{display:flex;gap:8px;flex-wrap:wrap}.lc-btns button{flex:1 1 90px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px;font:inherit;cursor:pointer}

<script>
const TYPES={move:"交通",food:"餐飲",hotel:"住宿",spot:"景點",shop:"購物"};
const $=id=>document.getElementById(id);
const SK="trip-store-v2",CK="itinerary-cloud-v1";
let store={trips:{},dirty:{}},cloud={},RO=false,tid=null,data=null,cur=0,view="day",tm,shareUrl="";
try{store=JSON.parse(localStorage.getItem(SK))||store}catch(e){}
store.lists=store.lists||{};
store.home=store.home||[];
try{cloud=JSON.parse(localStorage.getItem(CK))||{}}catch(e){}
(async function(){const q=new URLSearchParams(location.search),h=location.hash.match(/^#t=(.+)$/);
  if(!(q.get("i")&&q.get("s")&&h&&!q.get("v")))return;
  const id=q.get("i"),tok=decodeURIComponent(h[1]),url="https://script.google.com/macros/s/"+q.get("s")+"/exec";
  try{const r=await (await fetch(url+"?"+new URLSearchParams({action:"view",id}))).json(),T=group(r.rows||[])[id];if(!T)throw 0;
    T.token=tok;cloud={...cloud,url};store.trips[id]=T;delete store.dirty[id];persist();
    try{localStorage.setItem(CK,JSON.stringify(cloud))}catch(e){}
    history.replaceState(null,"",location.pathname+"#e="+id);route();toast("已加入共同編輯的行程")}
  catch(e){toast("邀請連結無效或已失效")}})();
const imgUrl=(f,w)=>"https://drive.google.com/thumbnail?id="+encodeURIComponent(f)+"&sz=w"+w;
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const persist=()=>{try{localStorage.setItem(SK,JSON.stringify(store))}catch(e){}};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(m,ms){const t=$("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),ms||(m.length>20?6000:1800))}
const sync=t=>$("sync").textContent=t;
async function why(x){const m=errMsg(x);if(!/連不到後端/.test(m))return m;
  try{await fetch(cloud.url+"?action=view&id=test",{mode:"no-cors"});
    return "能連到 Google，但回應被瀏覽器擋下。多半是公司（Workspace）帳號不允許公開存取，或後端網址被導向登入頁。請用無痕視窗開啟「網址?action=view&id=test」，看到登入畫面就是這個原因"}
  catch(e2){return "完全連不到 script.google.com。請確認不是在 claude.ai 預覽裡開啟，暫時關閉廣告攔截或隱私外掛，並檢查網路或 VPN"}}
function errMsg(x){const m=String(x&&x.message||x||"");
  if(/abort/i.test(m))return "連線逾時：網路太慢或後端沒有回應";
  if(/Failed to fetch|NetworkError|Load failed|network/i.test(m))return "連不到後端。請確認網址是 /exec 結尾、部署的「誰可以存取」選「所有人」，且不是在 claude.ai 預覽裡開啟";
  if(/^後端回傳/.test(m))return m+"。通常是「誰可以存取」沒有選「所有人」，或網址不是最新部署的 /exec";
  if(m==="沒有權限"||m==="密碼錯誤")return "密碼不對或沒有權限，請到頁面最下方重新設定雲端";
  return m||"未知錯誤"}
(function(){if(Object.keys(store.trips).length||new URLSearchParams(location.search).get("v"))return;
  let o=null;try{o=JSON.parse(localStorage.getItem("busan-yeosu-itinerary-v1"))}catch(e){}
  if(!o||!o.days)return;
  const id=uid();store.trips[id]={id,title:o.title||"釜山麗水",nights:Math.max(0,o.days.length-1),days:o.days};store.dirty[id]=1;persist()})();
/* cloud */
let netTimeout=25000;
async function call(o,post){const u=cloud.url;if(!u)throw new Error("nourl");
  const body=post?JSON.stringify({...o,key:cloud.key}):null,ac=new AbortController(),to=setTimeout(()=>ac.abort(),o.action==="upload"?Math.max(netTimeout,60000):netTimeout);
  let t;try{const res=await (post?fetch(u,{method:"POST",body,keepalive:flushing&&body.length<60000,signal:ac.signal}):fetch(u+"?"+new URLSearchParams({...o,key:cloud.key}),{cache:"no-store",signal:ac.signal}));t=await res.text()}finally{clearTimeout(to)}
 try{return JSON.parse(t)}catch(e){throw new Error("後端回傳的不是資料："+t.replace(/\s+/g," ").slice(0,60))}}
const fls=t=>t.flights?JSON.stringify(t.flights):"";
const parseFl=v=>{try{const a=JSON.parse(v||"null");return Array.isArray(a)?a:undefined}catch(e){return undefined}};
const toRows=t=>t.days.flatMap((d,di)=>{const h=[t.id,t.title,t.nights||0,di+1,d.label,d.date];
  return d.items.length?d.items.map((it,i)=>[...h,i+1,it.time,it.name,it.type,it.stay,it.next,it.note,it.kr||"",t.token||"",(it.imgs||[]).join(","),t.cover||"",fls(t),it.lat??"",it.lng??""]):[[...h,0,"","","","","","","",t.token||"","",t.cover||"",fls(t),"",""]]});
function group(rows){const T={};rows.sort((a,b)=>a[3]-b[3]||a[6]-b[6]).forEach(r=>{
  const t=T[r[0]]=T[r[0]]||{id:String(r[0]),title:String(r[1]),nights:+r[2]||0,days:[],token:String(r[14]||""),cover:String(r[16]||""),flights:parseFl(r[17])},k=+r[3]-1;
  const d=t.days[k]=t.days[k]||{label:String(r[4]),date:String(r[5]),items:[]};
  if(+r[6]>0)d.items.push({time:String(r[7]),name:String(r[8]),type:r[9]||"spot",stay:String(r[10]),next:String(r[11]),note:String(r[12]),kr:String(r[13]||""),imgs:String(r[15]||"").split(",").filter(Boolean),lat:(r[18]!==""&&r[18]!=null&&isFinite(+r[18]))?+r[18]:undefined,lng:(r[19]!==""&&r[19]!=null&&isFinite(+r[19]))?+r[19]:undefined})});
  Object.values(T).forEach(t=>t.days=t.days.filter(Boolean));return T}
let pullState="";let flushing=false;const inflight={},again={},sv={};
async function saveOnce(id){const t=store.trips[id];if(!t)return;store.ver=store.ver||{};const ver=store.ver[id]||0;sv[id]=ver;
  const done=txt=>{if((store.ver[id]||0)===ver){delete store.dirty[id];persist();sync(txt+new Date().toLocaleTimeString("zh-TW",{hour12:false}))}else sync("尚未存檔…")};
  const m=r=>JSON.stringify(r.map(x=>x.slice(0,17).map((c,i)=>i===14?"":String(c)))),want=toRows(t);
  try{sync("存檔中…");const r=await call({action:"save",id,token:t.token,rows:want},true);
    if(r.ok)done("已存檔 ");else sync("存檔失敗："+errMsg(r.error||"未知錯誤"))}
  catch(e){let ok=false;for(let k=0;k<4&&!ok;k++){if(k)await new Promise(z=>setTimeout(z,1500));
      try{const v=await call({action:"view",id});ok=Array.isArray(v.rows)&&m(v.rows)===m(want)}catch(e2){}}
    if(ok)done("已存檔（讀回確認）");else sync("存檔失敗："+await why(e))}}
function saveCloud(id){if(inflight[id]){if(((store.ver||{})[id]||0)>(sv[id]||0))again[id]=1;return inflight[id]}
  return inflight[id]=(async()=>{try{do{again[id]=0;await saveOnce(id)}while(again[id])}finally{delete inflight[id]}})()}
function schedule(id){if(!cloud.url)return;sync("尚未存檔…");clearTimeout(tm);tm=setTimeout(()=>saveCloud(id),1500)}
function save(){store.ver=store.ver||{};store.ver[tid]=(store.ver[tid]||0)+1;store.dirty[tid]=1;persist();schedule(tid)}
async function pull(){if(!cloud.url||!cloud.key)return;pullState="loading";
  try{const r=await call({action:"all"});if(r.error||!r.rows)throw 0;const T=group(r.rows);if(Array.isArray(r.home))store.home=r.home;
    for(const id in T)if(!store.dirty[id]){const old=store.trips[id];if(old&&old.flights&&T[id].flights===undefined)T[id].flights=old.flights;store.trips[id]=T[id]}
    if(r.lists)for(const id in r.lists)if(!store.ldirty[id])store.lists[id]=r.lists[id];
    for(const id in store.trips)if(!T[id]&&!store.dirty[id])delete store.trips[id];
    pullState=Object.keys(T).length?"ok":"empty";persist();if(!tid)renderHome()}catch(e){pullState="fail";toast("無法連線雲端，目前顯示本機資料");if(!tid)renderHome()}}
async function refreshTrip(id){if(!cloud.url||RO||store.dirty[id]||inflight[id])return;

let locI=-1,locBack=false;
function parseLL(s){s=String(s||"");const m=s.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/)||s.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/)||s.match(/[?&](?:q|ll|query|destination)=(-?\d+\.\d+)(?:,|%2C)(-?\d+\.\d+)/i)||s.match(/^\s*(-?\d{1,2}\.\d+)\s*[,，\s]\s*(-?\d{1,3}\.\d+)\s*$/);
  if(!m)return null;const a=+m[1],b=+m[2];return Math.abs(a)<=90&&Math.abs(b)<=180?{lat:a,lng:b}:null}

async function locSearch(src){const q=$("lc-q").value.trim(),msg=$("lc-msg"),box=$("lc-res");box.innerHTML="";

    if(r.error){msg.textContent=r.error;return}

const urlIn=v=>{const m=String(v||"").match(/https?:\/\/[^\s<>"']+/);return m?m[0]:String(v||"").trim()};
const isGgLink=v=>/^https?:\/\/(maps\.app\.goo\.gl|goo\.gl|g\.co|share\.google|(www\.|maps\.)?google\.[a-z.]+)\//i.test(String(v||"").trim());
let linkInfo="";
async function linkLL(v){v=urlIn(v);linkInfo="";const p=parseLL(v);if(p)return p;if(!isGgLink(v)||!cloud.url)return null;try{const r=await call({action:"geo",src:"link",q:String(v).trim(),id:tid,token:data.token||""});linkInfo=r.error||r.info||"";const x=(r.results||[])[0];return x?{lat:x.lat,lng:x.lng}:null}catch(e){linkInfo=String(e&&e.message||e);return null}}

/* 手機縮放自適應：頁面被雙指放大時，路線圖視窗仍保持滿版、關閉鈕不會跑出畫面 */
(function(){const vv=window.visualViewport,dl=[$("rdlg"),$("ldlg")];
  function fit(){dl.forEach(d=>{if(!d.open)return;
    if(!vv||vv.scale<=1.01){d.style.transform="";if(d.id==="rdlg"&&innerWidth<=600){d.style.top=d.style.left=d.style.width=d.style.height=""}return}
    if(d.id==="rdlg"&&innerWidth<=600){const k=vv.scale;
      d.style.position="fixed";d.style.margin="0";d.style.inset="auto";
      d.style.left=vv.offsetLeft+"px";d.style.top=vv.offsetTop+"px";
      d.style.width=(vv.width*k)+"px";d.style.height=(vv.height*k)+"px";d.style.maxWidth="none";d.style.maxHeight="none";
      d.style.transform="scale("+(1/k)+")"}})}
  if(vv){vv.addEventListener("resize",fit);vv.addEventListener("scroll",fit)}
  dl.forEach(d=>d.addEventListener("close",()=>{d.style.cssText=""}));
  /* iOS Safari：視窗開啟時擋掉整頁縮放，地圖縮放交給 Leaflet 處理 */
  document.addEventListener("gesturestart",e=>{if(dl.some(d=>d.open))e.preventDefault()},{passive:false});
  document.addEventListener("touchmove",e=>{if(e.touches.length>1&&dl.some(d=>d.open)&&!e.target.closest("#rmap"))e.preventDefault()},{passive:false});
  /* 雙擊關閉按鈕之外，Esc 也可關閉 */
})();

      if(pi)pdf.addPage();pdf.addImage(c.toDataURL("image/jpeg",0.92),"JPEG",M,M,CW,(y1-y0)/pxPerMm)});
    const md=d=>{const n=String(d||"").match(/\d+/g)||[];let m,x;if(n[0]&&n[0].length===4){m=n[1];x=n[2]}else{m=n[0];x=n[1]}return m&&x?String(m).padStart(2,"0")+String(x).padStart(2,"0"):""};
