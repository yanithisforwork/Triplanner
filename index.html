<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>旅遊行程規劃</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f8ecec;--card:#fffbfa;--ink:#44302b;--mute:#947c78;--line:#ecd5d5;--pri:#6a4639;--on:#fff7f5;--rose:#dc9aa6;--soft:#f3d6da;
--t-move:#a8948d;--t-food:#c4636f;--t-hotel:#9a6f8d;--t-spot:#b07a50;--t-shop:#e08fa3}
@media (prefers-color-scheme:dark){:root{--bg:#2a1e1f;--card:#362728;--ink:#f5e6e4;--mute:#bba3a0;--line:#4f3a3b;--pri:#e6b8be;--on:#2e1f20;--rose:#cf8f9b;--soft:#4a3235;
--t-move:#b8a69f;--t-food:#e08b94;--t-hotel:#b997b0;--t-spot:#d4a077;--t-shop:#e6a5b2}}
*{box-sizing:border-box}[hidden]{display:none!important}
html{scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
h1,h3,.brand,.title{font-family:"Noto Serif TC","Songti TC",serif;font-weight:700}
button,select,input,textarea{font:inherit;color:inherit}
button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 14px;cursor:pointer}
button:hover{border-color:var(--rose)}
button.primary{background:var(--pri);border-color:var(--pri);color:var(--on)}
:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
.wrap{max-width:780px;margin:auto;padding:0 20px}
.homehead{display:flex;align-items:flex-end;gap:10px;padding:44px 0 22px;flex-wrap:wrap}
h1{margin:0;font-size:30px;letter-spacing:.08em;flex:1}
.homehead h1::after{content:"";display:block;width:36px;height:2px;background:var(--rose);margin-top:10px}
.hero{position:relative;height:200px;border-radius:18px;overflow:hidden;margin:0 0 22px;background:var(--soft)}
.hero svg{position:absolute;inset:0;width:100%;height:100%}
.hs{position:absolute;inset:0;opacity:0;transition:opacity 1s;display:block}.hs.on{opacity:1}
.hs img{width:100%;height:100%;object-fit:cover;display:block}
.hcap{position:absolute;left:0;right:0;bottom:0;padding:36px 20px 16px;background:linear-gradient(transparent,rgba(60,38,32,.62));color:#fff;display:flex;gap:10px;align-items:baseline}
.hcap b{font:700 20px "Noto Serif TC",serif;letter-spacing:.06em}
.hcap.fb{inset:0;background:none;color:#6a4639;font:700 22px "Noto Serif TC",serif;letter-spacing:.12em;align-items:center;padding:0 28px}
.dots{position:absolute;right:16px;bottom:14px;display:flex;gap:6px}.dots i{width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.55)}.dots i.on{background:#fff;width:16px}
.cv{height:84px;margin:-20px -20px 14px;background-size:cover}.cv img{width:100%;height:100%;object-fit:cover;display:block}
@media (prefers-color-scheme:dark){.hero svg{filter:brightness(.8)}}
@media (max-width:480px){.hero{height:160px}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;padding-bottom:60px}
.tc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;cursor:pointer;text-align:left;min-height:140px;display:flex;flex-direction:column;overflow:hidden}
.tc:hover{border-color:var(--rose)}
.tc h3{margin:0;font-size:20px;letter-spacing:.04em}
.tc p{margin:4px 0 0;color:var(--mute)}
.tc.new{align-items:center;justify-content:center;border-style:dashed;color:var(--pri);font-size:16px}
.tcact{margin-top:auto;padding-top:14px;display:flex;gap:6px}
.tcact button{padding:3px 12px;font-size:13px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:16px 0 6px}
.sp{flex:1}.sync{font-size:13px;color:var(--mute)}
.brand{color:var(--mute);letter-spacing:.2em;font-size:13px;margin-top:10px}
.titlebox{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:4px 0 6px}
.title{font-size:28px;border:0;border-bottom:1px solid transparent;background:none;padding:2px 0;min-width:0;width:min(100%,11em);letter-spacing:.04em}
.title:hover,.title:focus{border-bottom-color:var(--line)}
.meta{color:var(--mute)}.meta input{width:3em;border:0;border-bottom:1px dashed var(--line);background:none;text-align:center;color:inherit}
nav{position:sticky;top:0;background:var(--bg);z-index:5;border-bottom:1px solid var(--line);margin-top:10px}
.tabs{max-width:780px;margin:auto;display:flex;gap:4px;padding:8px 20px;overflow-x:auto}
.tab{border:0;background:none;padding:7px 16px;border-radius:999px;white-space:nowrap;color:var(--mute)}
.tab.on{background:var(--soft);color:var(--pri);font-weight:700}
main{max-width:780px;margin:auto;padding:18px 20px 80px}
.dayhead{display:flex;gap:8px;align-items:center;margin-bottom:14px}
.dayhead input{border:0;border-bottom:1px dashed var(--line);background:none;padding:4px 2px;font-size:18px;font-weight:700;width:9em;font-family:"Noto Serif TC",serif}
.dayhead input.date{font-weight:500;font-size:15px;color:var(--mute);width:7em;font-family:inherit}
.stop{display:grid;grid-template-columns:64px 1fr;gap:12px}
.time{padding-top:14px;text-align:right}
.time input{width:100%;text-align:right;border:0;background:none;font-weight:700;font-size:17px;padding:0}
.card{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--c);border-radius:12px;padding:10px 14px;--c:var(--t-spot)}
.card[data-t=move]{--c:var(--t-move)}.card[data-t=food]{--c:var(--t-food)}.card[data-t=hotel]{--c:var(--t-hotel)}.card[data-t=shop]{--c:var(--t-shop)}
.name{width:100%;border:0;background:none;font-size:17px;font-weight:700;padding:2px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--mute);font-size:13px}
.row select,.row input{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px 6px}
.row input.stay{width:9em}.row input.kr{width:11em}
.note{width:100%;margin-top:6px;border:1px dashed var(--line);border-radius:8px;background:none;padding:6px 8px;resize:vertical;min-height:34px;font-size:14px}
.acts{display:flex;gap:4px;margin-left:auto}
.acts button{padding:0 8px;font-size:13px;line-height:24px}
.grip{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;padding:0 8px;font-size:18px;line-height:24px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.stop.dragging{opacity:.45}.stop.over .card{outline:2px dashed var(--rose)}
.gap{grid-column:2;display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:4px 0 4px 6px;color:var(--mute);font-size:13px;border-left:2px dotted var(--line);padding:6px 0 6px 14px}
.gap input{border:0;border-bottom:1px dashed var(--line);background:none;width:11em;padding:0 2px;color:var(--mute)}
a.nv{color:var(--pri);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:13px;background:var(--bg)}
a.nv:hover{border-color:var(--rose)}
.add{margin-top:14px;width:100%;border-style:dashed;color:var(--pri)}
.pics{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.pic{position:relative;width:96px;height:96px;border-radius:10px;overflow:hidden;border:1px solid var(--line);cursor:zoom-in;background:var(--bg)}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.pic .x{position:absolute;top:4px;right:4px;width:22px;height:22px;padding:0;border-radius:50%;background:rgba(60,40,35,.72);color:#fff;border:0;font-size:12px;line-height:22px}
.addimg{width:96px;height:96px;border:1px dashed var(--rose);border-radius:10px;background:none;color:var(--pri);font-size:13px;padding:0}
.pic .cvb{position:absolute;top:4px;left:4px;width:22px;height:22px;padding:0;border-radius:50%;background:rgba(60,40,35,.72);color:#fff;border:0;font-size:12px;line-height:22px}.pic .cvb.on{background:var(--rose)}
.ro .addimg,.ro .pic .x,.ro .pic .cvb{display:none}
#cvr,#cvx{font-size:13px;padding:2px 12px}
.lb{position:fixed;inset:0;background:rgba(40,25,22,.85);display:none;align-items:center;justify-content:center;z-index:30;padding:20px;cursor:zoom-out}
.lb.on{display:flex}.lb img{max-width:100%;max-height:100%;border-radius:12px}
.lb button{position:absolute;top:14px;right:18px;border:0;background:none;color:#fff;font-size:28px}
.foot{max-width:780px;margin:0 auto;padding:0 20px 60px}.foot button{color:var(--mute);font-size:13px}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);padding:24px;width:min(92vw,400px)}
dialog::backdrop{background:rgba(60,40,35,.4)}
dialog h3{margin:0 0 6px;font-size:20px}
dialog label{display:block;margin:12px 0 4px;color:var(--mute);font-size:13px}
dialog input{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg)}
.dact{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}
.hint{color:var(--mute);font-size:13px;margin:12px 0 0}
.toast{max-width:90vw;text-align:center;position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.show{opacity:1}
.ro #back,.ro #save,.ro #share,.ro #inv,.ro #exp,.ro .acts,.ro .add,.ro [data-adddays],.ro [data-delday],.ro .kr,.ro .note:placeholder-shown{display:none}
.ro input,.ro textarea,.ro select{border-color:transparent!important;background:none!important;appearance:none;-webkit-appearance:none;pointer-events:none}
.ro .row select{padding:0}
#pv{display:none}
@media print{body>section,dialog,.toast{display:none!important}#pv{display:block}body{background:#fff;color:#000}
#pv h1{font-size:24px;margin:0 0 2px}#pv .sub{color:#666;margin-bottom:14px}
#pv h2{font:700 18px "Noto Serif TC",serif;margin:18px 0 8px;padding-bottom:4px;border-bottom:1px solid #999;break-after:avoid}
#pv .pi{display:grid;grid-template-columns:56px 1fr;gap:8px;padding:3px 0;break-inside:avoid}
#pv .pi b{text-align:right}#pv .pi small{color:#666}#pv .mv{margin-left:64px;color:#777;font-size:12px;break-inside:avoid}#pv .pi img{width:110px;margin:6px 6px 0 0;border-radius:6px}}
.dayhead button{white-space:nowrap}
@media (max-width:480px){.dayhead input{width:6em;min-width:0}.dayhead input.date{width:5em}.stop{grid-template-columns:52px 1fr;gap:8px}.time input{font-size:15px}.title{font-size:24px}}
</style>
</head>
<body>
<section id="home" hidden><div class="wrap">
  <div class="homehead"><h1>旅遊行程規劃</h1><button id="homepics">輪播照片</button></div>
  <div class="hero" id="hero"></div>
  <div class="grid" id="grid"></div>
</div></section>
<section id="editor" hidden><div class="wrap">
  <div class="bar"><button id="back">← 首頁</button><span id="sync" class="sync"></span><span class="sp"></span>
    <button id="save" class="primary">存檔</button><button id="share">分享</button><button id="inv">邀請共同編輯</button><button id="exp">匯出</button><button id="print">列印</button></div>
  <div class="brand">旅遊行程規劃</div>
  <div class="titlebox"><input id="title" class="title" aria-label="行程名稱" placeholder="行程名稱">
    <span class="meta"><input id="ndays" type="number" min="1" max="30" aria-label="天數">天<input id="nights" type="number" min="0" max="30" aria-label="夜數">夜</span><button id="cvr">設定封面</button><button id="cvx">清除封面</button></div>
</div>
<nav><div class="tabs" id="tabs"></div></nav>
<main id="main"></main>
<div class="foot" id="foot"><button id="cfg">雲端設定</button><button id="diag">連線診斷</button></div></section>
<dialog id="dlg"><h3>新增行程</h3>
  <label for="nn">行程名稱</label><input id="nn" placeholder="例如：東京五日">
  <label for="nd">天數</label><input id="nd" type="number" min="1" max="30" value="3">
  <label for="nnt">夜數</label><input id="nnt" type="number" min="0" max="30" value="2">
  <div class="dact"><button id="dcancel">取消</button><button id="dok" class="primary">建立</button></div></dialog>
<dialog id="hdlg"><h3>首頁輪播照片</h3><p class="hint" style="margin:0 0 10px">上傳後會優先輪播這些照片；全部移除時，會自動使用各行程的封面。</p><div class="pics" id="hl"></div><div class="dact"><button id="hdone" class="primary">完成</button></div></dialog>
<dialog id="shr"><h3 id="sh3">分享行程</h3><p class="hint" id="shint" style="margin:0 0 10px"></p>
  <input id="lnk" readonly aria-label="分享連結">
  <div class="dact"><button id="cp">複製連結</button><button id="sys" hidden>其他方式</button><button id="line" class="primary">分享到 LINE</button><button id="sclose">關閉</button></div></dialog>
<div class="lb" id="lb"><button aria-label="關閉">✕</button><img id="big" alt=""></div>
<input type="file" accept="image/*" id="pf" hidden>
<div id="pv"></div>
<div class="toast" id="toast"></div>
<script>
const TYPES={move:"交通",food:"餐飲",hotel:"住宿",spot:"景點",shop:"購物"};
const S=(time,name,type,stay,next="",note="")=>({time,name,type,stay,next,note});
const DEFAULT={title:"釜山麗水",days:[
{label:"第1天",date:"11/13",items:[
S("06:05","金海機場巴士站","move","1小時","巴士 13分"),
S("07:18","沙上站","move","07:30 離開","巴士 3小時02分"),
S("10:32","麗水綜合巴士客運站","move","5分鐘","巴士 15分"),
S("10:52","麗水堂","food","30分鐘","","有筆記"),
S("11:22","Bada Gimbap 中央總店","food","30分鐘","自訂交通 10分"),
S("12:02","新羅舒泰麗水","hotel","30分鐘","自訂交通 10分"),
S("12:42","梧桐島東柏列車乘車處","spot","5分鐘","自訂交通 15分"),
S("13:02","梧桐島","spot","1小時30分","自訂交通 20分"),
S("14:52","麗水海上纜車自山站","spot","30分鐘","自訂交通 30分"),
S("15:52","麗水海上纜車","spot","1小時","自訂交通 20分"),
S("17:12","南珍家醬蟹白帶魚名家","food","1小時","自訂交通 20分"),
S("18:32","李舜臣廣場","spot","1小時","自訂交通 20分"),
S("19:52","麗水海洋公園","spot","")]},
{label:"第2天",date:"11/14",items:[
S("10:00","新羅舒泰麗水","hotel","10:00 離開","巴士 31分"),
S("10:31","麗水綜合巴士客運站","move","10:31 離開","巴士 3小時46分"),
S("14:17","釜山西部客運轉運站","move","14:20 離開","巴士 23分"),
S("14:43","Urbanstay 西面","hotel","30分鐘","自訂交通 20分"),
S("15:33","Pujuin 西面店","food","1小時"),
S("16:33","西面地下道街・西面 Mall","shop","3小時"),
S("19:33","Urbanstay 西面","hotel","30分鐘","巴士 29分"),
S("20:32","南浦洞","spot","1小時","","有筆記"),
S("21:32","樂天超市 光復店","shop","1小時","巴士 23分"),
S("22:55","Urbanstay 西面","hotel","1小時")]},
{label:"第3天",date:"11/15",items:[
S("08:00","Urbanstay Seomyeon","hotel","1小時","巴士 24分"),
S("09:24","海雲台溫德姆華美達安可酒店","hotel","4小時","巴士 19分","有筆記"),
S("13:43","Sentica 廣安","spot","1小時"),
S("14:43","All Sunday 廣安店","food","1小時","巴士 40分"),
S("16:23","安木 西面店","food","1小時","巴士 13分"),
S("17:36","Urbanstay Seomyeon","hotel","1小時","巴士 40分"),
S("19:16","金海機場國際線 Dunkin’","food","1小時")]}
]};
const $=id=>document.getElementById(id);
const SK="trip-store-v2",CK="itinerary-cloud-v1";
let store={trips:{},dirty:{}},cloud={},RO=false,tid=null,data=null,cur=0,tm,shareUrl="";
try{store=JSON.parse(localStorage.getItem(SK))||store}catch(e){}
store.home=store.home||[];
try{cloud=JSON.parse(localStorage.getItem(CK))||{}}catch(e){}
(async function(){const q=new URLSearchParams(location.search),h=location.hash.match(/^#t=(.+)$/);
  if(!(q.get("i")&&q.get("s")&&h&&!q.get("v")))return;
  const id=q.get("i"),tok=decodeURIComponent(h[1]),url="https://script.google.com/macros/s/"+q.get("s")+"/exec";
  try{const r=await (await fetch(url+"?"+new URLSearchParams({action:"view",id}))).json(),T=group(r.rows||[])[id];if(!T)throw 0;
    T.token=tok;cloud={...cloud,url};store.trips[id]=T;delete store.dirty[id];persist();
    try{localStorage.setItem(CK,JSON.stringify(cloud))}catch(e){}
    history.replaceState(null,"",location.pathname+"#e="+id);route();toast("已加入共同編輯的行程")}
  catch(e){toast("邀請連結無效或已失效")}})();
const imgUrl=(f,w)=>"https://drive.google.com/thumbnail?id="+encodeURIComponent(f)+"&sz=w"+w;
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const persist=()=>{try{localStorage.setItem(SK,JSON.stringify(store))}catch(e){}};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),m.length>20?6000:1800)}
const sync=t=>$("sync").textContent=t;
async function why(x){const m=errMsg(x);if(!/連不到後端/.test(m))return m;
  try{await fetch(cloud.url+"?action=view&id=test",{mode:"no-cors"});
    return "能連到 Google，但回應被瀏覽器擋下。多半是公司（Workspace）帳號不允許公開存取，或後端網址被導向登入頁。請用無痕視窗開啟「網址?action=view&id=test」，看到登入畫面就是這個原因"}
  catch(e2){return "完全連不到 script.google.com。請確認不是在 claude.ai 預覽裡開啟，暫時關閉廣告攔截或隱私外掛，並檢查網路或 VPN"}}
function errMsg(x){const m=String(x&&x.message||x||"");
  if(/Failed to fetch|NetworkError|Load failed|network/i.test(m))return "連不到後端。請確認網址是 /exec 結尾、部署的「誰可以存取」選「所有人」，且不是在 claude.ai 預覽裡開啟";
  if(/^後端回傳/.test(m))return m+"。通常是「誰可以存取」沒有選「所有人」，或網址不是最新部署的 /exec";
  if(m==="沒有權限"||m==="密碼錯誤")return "密碼不對或沒有權限，請到頁面最下方重新設定雲端";
  return m||"未知錯誤"}
(function(){if(Object.keys(store.trips).length||new URLSearchParams(location.search).get("v"))return;
  let o=null;try{o=JSON.parse(localStorage.getItem("busan-yeosu-itinerary-v1"))}catch(e){}
  if(!o||!o.days)return;
  const id=uid();store.trips[id]={id,title:o.title||"釜山麗水",nights:Math.max(0,o.days.length-1),days:o.days};store.dirty[id]=1;persist()})();
/* cloud */
async function call(o,post){const u=cloud.url;if(!u)throw new Error("nourl");
  const res=await (post?fetch(u,{method:"POST",body:JSON.stringify({...o,key:cloud.key})}):fetch(u+"?"+new URLSearchParams({...o,key:cloud.key})));
  const t=await res.text();try{return JSON.parse(t)}catch(e){throw new Error("後端回傳的不是資料："+t.replace(/\s+/g," ").slice(0,60))}}
const toRows=t=>t.days.flatMap((d,di)=>{const h=[t.id,t.title,t.nights||0,di+1,d.label,d.date];

function group(rows){const T={};rows.sort((a,b)=>a[3]-b[3]||a[6]-b[6]).forEach(r=>{

      else{const it=data.days[cur].items[pickIdx];(it.imgs=it.imgs||[]).push(r.fid);save();render()}
      toast("已加入圖片")}
    catch(x){toast("上傳失敗："+await why(x))}};
  im.onerror=()=>toast("無法讀取這張圖片");im.src=URL.createObjectURL(f)};
$("ndays").onchange=()=>{if(RO)return;const n=Math.min(30,Math.max(1,+$("ndays").value||1)),a=data.days;
  if(n<a.length){if(a.slice(n).some(d=>d.items.length)&&!confirm("減少天數會刪除最後 "+(a.length-n)+" 天的內容，確定嗎？")){$("ndays").value=a.length;return}a.length=n}
  else while(a.length<n)a.push({label:"第"+(a.length+1)+"天",date:"",items:[]});
  data.nights=Math.max(0,n-1);$("nights").value=data.nights;if(cur>=a.length)cur=a.length-1;save();render()};
$("back").onclick=()=>{location.hash=""};
function buildPrint(){if(!data)return;
  $("pv").innerHTML=`<h1>${esc(data.title)}</h1><div class="sub">${data.days.length}天${+data.nights||0}夜</div>`+data.days.map(d=>
    `<h2>${esc(d.label)}${d.date?"　"+esc(d.date):""}</h2>`+d.items.map((it,i)=>
      `<div class="pi"><b>${esc(it.time)}</b><div>${esc(it.name)}<br><small>${TYPES[it.type]||""}${it.stay?"・停留 "+esc(it.stay):""}</small>${it.note?`<br><small>${esc(it.note)}</small>`:""}${(it.imgs||[]).length?"<br>"+it.imgs.map(f=>`<img src="${imgUrl(f,300)}" alt="">`).join(""):""}</div></div>`+
      (it.next&&i<d.items.length-1?`<div class="mv">↓ ${esc(it.next)}</div>`:"")).join("")).join("")}
addEventListener("beforeprint",buildPrint);
$("print").onclick=()=>print();
$("save").onclick=()=>{if(!cloud.url){toast("請先到頁面最下方按「雲端設定」");return}clearTimeout(tm);saveCloud(tid)};
$("share").onclick=()=>shareTrip(tid);
$("inv").onclick=()=>inviteTrip(tid);
$("exp").onclick=()=>{const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([JSON.stringify({title:data.title,nights:data.nights,days:data.days},null,2)],{type:"application/json"}));
  a.download=(data.title||"itinerary")+".json";a.click();toast("已匯出")};
$("cfg").onclick=()=>{const u=prompt("貼上 Apps Script 網頁應用程式網址（結尾為 /exec）",cloud.url||"");if(u===null)return;
  const k=prompt("輸入密碼（需與 Code.gs 裡的 KEY 相同）",cloud.key||"");if(k===null)return;
  cloud={url:u.trim(),key:k.trim()};try{localStorage.setItem(CK,JSON.stringify(cloud))}catch(e){}
  if(!/\/exec$/.test(cloud.url)){alert("網址結尾必須是 /exec，請回到 Apps Script 的「部署 → 管理部署作業」複製「網頁應用程式」網址。");return}
  toast("正在測試連線…");
  call({action:"view",id:"test"}).then(r=>{if(!Array.isArray(r.rows))throw new Error("後端沒有正確回應");return call({action:"all"})})
    .then(r=>{if(r.error)throw new Error(r.error);toast("連線成功");return Promise.all(Object.keys(store.dirty).map(saveCloud))}).then(pull)
    .catch(async x=>toast("連線失敗："+await why(x)))};
$("diag").onclick=async()=>{if(!cloud.url){alert("請先按「雲端設定」");return}
  const t=[];for(const [n,f] of [["讀取（GET）",()=>call({action:"view",id:"test"})],["寫入（POST）",()=>call({action:"ping"},true)]]){
    try{await f();t.push(n+"：成功")}catch(e){t.push(n+"：失敗（"+(e.message||e)+"）")}}
  alert("連線診斷\n"+t.join("\n"))};
$("nd").oninput=()=>{$("nnt").value=Math.max(0,(+$("nd").value||1)-1)};
$("dcancel").onclick=()=>$("dlg").close();
$("dok").onclick=()=>{const n=$("nn").value.trim();if(!n){$("nn").focus();return}
  const N=Math.min(30,Math.max(1,+$("nd").value||1)),id=uid();
  store.trips[id]={id,title:n,nights:Math.max(0,+$("nnt").value||0),days:Array.from({length:N},(_,i)=>({label:"第"+(i+1)+"天",date:"",items:[]}))};
  store.dirty[id]=1;persist();$("dlg").close();schedule(id);location.hash="#e="+id};
$("sclose").onclick=()=>$("shr").close();
$("cp").onclick=async()=>{try{await navigator.clipboard.writeText(shareUrl);toast("已複製連結")}catch(e){$("lnk").select();toast("請手動複製連結")}};
$("line").onclick=()=>window.open("https://social-plugins.line.me/lineit/share?url="+encodeURIComponent(shareUrl),"_blank");
$("sys").onclick=()=>navigator.share({title:store.trips[tid]?store.trips[tid].title:"旅遊行程",url:shareUrl}).catch(()=>{});
/* routing */
async function openView(id,s){RO=true;document.body.classList.add("ro");$("title").readOnly=true;$("nights").readOnly=true;$("ndays").readOnly=true;
  $("home").hidden=true;$("editor").hidden=false;$("main").innerHTML='<p style="color:var(--mute)">載入中…</p>';
  try{const r=await fetch("https://script.google.com/macros/s/"+encodeURIComponent(s)+"/exec?"+new URLSearchParams({action:"view",id}));
    data=group((await r.json()).rows||[])[id];if(!data)throw 0;cur=0;showEditor()}
  catch(e){document.body.innerHTML='<p style="padding:48px 24px;text-align:center">找不到這份行程，連結可能已失效。</p>'}}
function route(){const q=new URLSearchParams(location.search);
  if(q.get("v")){openView(q.get("v"),q.get("s")||"");return}
  const m=location.hash.match(/^#e=(.+)$/);
  if(m&&store.trips[m[1]]){tid=m[1];data=store.trips[tid];cur=0;showEditor();refreshTrip(tid)}else{showHome();pull()}}
window.onhashchange=route;route();
</script>
</body>
</html>
